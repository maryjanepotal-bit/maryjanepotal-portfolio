<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MJP Empire — Portfolio In Progress</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f7f5f0;
      color: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 2rem;
    }
    header {
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: #555;
    }
    main {
      max-width: 640px;
      margin: auto 0;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #666;
      margin-bottom: 2rem;
    }
    .contact-link {
      display: inline-block;
      text-decoration: none;
      color: #111;
      font-weight: 500;
      border-bottom: 1.5px solid #111;
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
    }
    .contact-link:hover {
      opacity: 0.6;
    }
    footer {
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <header>MJP Empire</header>

  <main>
    <h1>Refining the craft. New portfolio launching soon.</h1>
    <p>
      Currently rendering new visual works and finalizing case studies. In the meantime, inquiries and project collaborations are open.
    </p>
    <a href="mailto:info@mjp-empire.com" class="contact-link">Get in touch &rarr; info@mjp-empire.com</a>
  </main>

  <footer>
    &copy; 2026 MJP Empire. All rights reserved.
  </footer>
</body>
</html>
